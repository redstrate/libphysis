[package]
name = "libphysis"
version = "0.7.1"
authors = ["Joshua Goins <josh@redstrate.com>"]
edition = "2024"
description = "C bindings for physis"
license = "GPL-3.0"
repository = "https://github.com/redstrate/libphysis"
keywords = ["ffxiv", "modding"]
readme = "README.md"
publish = false

[lib]
name = "physis"
crate-type = ["staticlib"]

[build-dependencies]
cbindgen = { version = "0.29", default-features = false }

[dependencies]
physis = { version = "0.7.1", default-features = false }
